<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CLAP — Ad Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f2;--white:#fff;--border:#ddddd8;--borderl:#e9e9e5;
  --text:#111;--t2:#464642;--t3:#8a8a84;
  --green:#166f40;--gbg:#eaf5f0;--red:#b02e24;--rbg:#fdf0ef;
  --amber:#8a5c00;--abg:#fef8e7;--blue:#1557a0;--bbg:#e8f4ff;
  --sw:214px;--hh:58px;--r:8px;
}
html,body{height:100%;font-family:'Calibri',Calibri,Candara,Geneva,Tahoma,sans-serif;font-size:13.5px;color:var(--text);background:var(--bg);}
.app{display:flex;height:100vh;overflow:hidden;}
/* Sidebar */
.sb{width:var(--sw);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
.sb-logo .n{font-size:14px;font-weight:700;letter-spacing:.3px;}
.sb-logo .s{font-size:9px;color:var(--t3);margin-top:3px;letter-spacing:.7px;text-transform:uppercase;}
.sb-sec{padding:14px 16px 5px;font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);}
.sb-it{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--t2);border-left:2.5px solid transparent;transition:all .12s;user-select:none;}
.sb-it:hover{background:#f6f6f4;color:var(--text);}
.sb-it.on{color:var(--text);font-weight:600;border-left-color:var(--text);background:#efeeeb;}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);font-size:9.5px;color:var(--t3);line-height:1.8;}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{height:var(--hh);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;position:relative;z-index:200;}
.tb-ttl{font-size:14.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Calendar */
.cal-wrap{position:relative;flex-shrink:0;}
.cal-btn{display:flex;align-items:center;gap:8px;padding:6px 13px;background:var(--white);border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--text);user-select:none;white-space:nowrap;min-width:200px;transition:border-color .12s;}
.cal-btn:hover{border-color:#999;}
.cal-btn .ci{font-size:13px;}
.cal-btn .cl{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;}
.cal-btn .ca{font-size:8px;color:var(--t3);transition:transform .15s;}
.cal-btn .ca.up{transform:rotate(180deg);}
.cal-dd{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:0 10px 36px rgba(0,0,0,.13);z-index:400;width:540px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow:hidden;flex-direction:column;}
.qtag{font-weight:600;color:var(--text);}
.qsub{color:var(--t3);font-size:11px;margin-left:4px;}
.qas td{background:#f1f0ec;font-weight:700;color:var(--text);text-align:left !important;padding:10px 14px !important;font-size:12.5px;}
.qwk td{background:var(--text);color:#fff;font-weight:600;text-align:left !important;padding:7px 14px !important;font-size:11.5px;letter-spacing:.4px;}
.qleg{padding:14px 16px 16px;border-top:1px solid var(--borderl);background:#fafaf8;}
.qlh{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.qlr{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--borderl);}
.qlr b{color:var(--text);font-weight:600;}.qlr span{color:var(--t2);}
.qlp{font-size:12px;line-height:1.55;color:var(--t2);max-width:900px;}
@media(max-width:700px){.qlr{grid-template-columns:1fr;gap:2px;}}
.dmh,.dmr{display:grid;grid-template-columns:90px 1fr 56px 64px;gap:10px;align-items:center;}
.dmh{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);padding:6px 0;border-bottom:1px solid var(--borderl);}
.dmh span:nth-child(n+3),.dmr .dms,.dmr .dmv{text-align:right;}
.dmr{padding:8px 0;border-bottom:1px solid var(--borderl);font-size:12.5px;}
.dml{color:var(--text);font-weight:600;}
.dmb{position:relative;height:22px;display:flex;align-items:center;}
.dmb i{display:block;height:100%;border-radius:3px;}
.dmb b{margin-left:8px;font-weight:600;font-size:12px;color:var(--text);white-space:nowrap;}
.dms,.dmv{color:var(--t2);}
.dmsum{font-size:13px;color:var(--t2);margin:2px 0 12px;}.dmsum b{color:var(--text);}
.qnote{font-size:11.5px;color:var(--t3);padding:9px 14px;border-top:1px solid var(--borderl);background:#fafaf8;}
.cal-dd.open{display:flex;}
@media(max-width:700px){.cal-dd{position:fixed;left:12px;right:12px;top:60px;width:auto;max-width:none;}}
.cal-scroll{overflow-y:auto;flex:1;}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:14px 12px 6px;}
.cal-col{padding:4px 10px 10px;}
.cal-col+.cal-col{border-left:1px solid var(--borderl);}
.cal-mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--borderl);}
.cal-mname{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text);}
.cal-mbtn{font-size:9px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--t2);cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap;}
.cal-mbtn:hover:not(:disabled){background:var(--border);}
.cal-mbtn.msel{background:var(--text);color:#fff;border-color:var(--text);}
.cal-mbtn:disabled{opacity:.25;cursor:default;}
.cal-wbtn{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:5px;border:1px solid transparent;background:transparent;font-family:inherit;font-size:10.5px;color:var(--t2);cursor:pointer;transition:all .12s;margin-bottom:3px;}
.cal-wbtn:hover:not(:disabled){background:var(--bg);border-color:var(--border);}
.cal-wbtn.wsel{background:var(--text);color:#fff;}
.cal-wbtn:disabled{opacity:.22;cursor:default;}
.cal-bar{border-top:1px solid var(--border);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;background:#fafaf8;flex-shrink:0;}
.cal-sum{font-size:12px;color:var(--t2);font-weight:500;}
.cal-clr{font-size:11.5px;color:var(--t3);cursor:pointer;border:none;background:none;font-family:inherit;padding:4px 8px;border-radius:4px;}
.cal-clr:hover{background:var(--bg);}
/* Tabs */
.tabs{display:flex;gap:1px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:2px;flex-shrink:0;}
.tab{padding:5px 13px;border-radius:4px;font-size:11.5px;cursor:pointer;color:var(--t2);white-space:nowrap;transition:all .12s;}
.tab.on{background:var(--white);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.content{flex:1;overflow-y:auto;padding:22px 26px;}
/* KPIs */
.kg{display:grid;gap:13px;margin-bottom:18px;}
.kc{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;}
.kl{font-size:8.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.kv{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.6px;}
.kv.na{color:var(--t3);font-size:20px;}
.ks{font-size:11px;color:var(--t3);margin-top:5px;}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:7px;}
.chip.up{background:var(--gbg);color:var(--green);}
.chip.dn{background:var(--rbg);color:var(--red);}
.chip.neu{background:#f0f0ec;color:var(--t3);}
/* Layout */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px;}
.sec h2{font-size:9px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--t3);}
.secn{font-size:11px;color:var(--t3);}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;}
.pttl{font-size:8.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:14px;}
/* Bars */
.bars{display:flex;flex-direction:column;gap:9px;}
.brow{display:flex;align-items:center;gap:10px;}
.blbl{width:108px;font-size:12px;color:var(--t2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.btrack{flex:1;height:18px;background:var(--bg);border-radius:3px;overflow:hidden;}
.bfill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bnum{width:76px;font-size:12px;font-weight:600;text-align:right;flex-shrink:0;white-space:nowrap;}
/* Tables */
.dt{width:100%;border-collapse:collapse;font-size:13px;}
.dt thead th{font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t3);padding:9px 11px;border-bottom:1.5px solid var(--border);text-align:right;white-space:nowrap;}
.dt thead th:first-child{text-align:left;}
.dt thead th.thc{width:38px;padding:9px 6px;}
.dt thead th.tha{width:150px;padding:9px 8px;text-align:left;}
.dt tbody td{padding:9px 11px;border-bottom:1px solid var(--borderl);text-align:right;white-space:nowrap;}
.dt tbody td:first-child{text-align:left;}
.dt tbody tr:last-child td{border-bottom:none;}
.dt tbody tr:hover td{background:#f8f8f6;}
.dt tfoot td{padding:10px 11px;border-top:2px solid var(--border);font-weight:700;text-align:right;background:#f6f6f4;white-space:nowrap;}
.dt tfoot td:first-child{text-align:left;}
.vc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.vdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tup{color:var(--green);font-weight:600;}
.tdn{color:var(--red);font-weight:600;}
.tna{color:var(--t3);}
/* Toggle */
.tog{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:9px;color:var(--t3);transition:all .12s;user-select:none;vertical-align:middle;}
.tog:hover{background:var(--border);}
.tog.open{background:var(--text);color:#fff;border-color:var(--text);}
/* Ad-set rows */
.ads-row td{font-size:12px;color:var(--t2);padding:7px 11px 7px 28px !important;background:#fafafa;border-bottom:1px solid var(--borderl);}
.ads-row td:not(:first-child){text-align:right;}
.ads-row td:first-child::before{content:"↳ ";color:var(--t3);}
/* Analysis tags */
.anote{font-size:12px;color:var(--t2);line-height:1.5;}
/* Monthly spend blocks */
.spend-month-block{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:18px;}
.spend-month-hd{padding:13px 18px;background:#f8f8f6;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.spend-month-name{font-size:12.5px;font-weight:700;}
.spend-month-total{font-size:13px;font-weight:700;}
.svr{display:flex;align-items:center;padding:10px 18px;border-bottom:1px solid var(--borderl);gap:12px;}
.svr:last-child{border-bottom:none;}
.svr:hover{background:#fafafa;}
.svr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.svr-name{width:118px;font-size:13px;font-weight:600;flex-shrink:0;}
.svr-bwrap{flex:1;height:16px;background:var(--bg);border-radius:3px;overflow:hidden;}
.svr-bar{height:100%;border-radius:3px;}
.svr-amt{width:78px;font-size:13px;font-weight:600;text-align:right;flex-shrink:0;}
.svr-tog{width:34px;flex-shrink:0;text-align:right;}
.svr-tog button{font-size:9.5px;color:var(--t3);border:1px solid var(--border);background:var(--bg);border-radius:4px;padding:2px 6px;cursor:pointer;font-family:inherit;transition:all .12s;}
.svr-tog button.open{background:var(--text);color:#fff;border-color:var(--text);}
.swr-wrap{background:#fafafa;border-bottom:1px solid var(--borderl);}
.swr{display:flex;align-items:baseline;padding:6px 18px 6px 38px;gap:12px;border-bottom:1px solid var(--borderl);}
.swr:last-child{border-bottom:none;}
.swr-lbl{width:130px;font-size:11px;color:var(--t2);flex-shrink:0;}
.swr-acts{flex:1;font-size:11px;color:var(--t3);}
.swr-amt{width:78px;font-size:11.5px;font-weight:600;text-align:right;color:var(--t2);}
/* MoM */
.momgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--white);margin-bottom:18px;}
.momcell{padding:18px 20px;}
.momcell+.momcell{border-left:1px solid var(--border);}
.momlbl{font-size:8.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:10px;}
.momval{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.momprv{font-size:11px;color:var(--t3);margin-top:4px;}
.momchip{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:8px;}
.momchip.up{background:var(--gbg);color:var(--green);}
.momchip.dn{background:var(--rbg);color:var(--red);}
.momchip.neu{background:#f0f0ec;color:var(--t3);}
/* Funnel */
.funnel{display:flex;flex-direction:column;gap:7px;}
.fnrow{display:flex;align-items:center;gap:10px;}
.fnlbl{width:90px;font-size:12px;color:var(--t2);text-align:right;flex-shrink:0;}
.fnbar{border-radius:4px;height:30px;display:flex;align-items:center;padding:0 13px;font-size:12.5px;font-weight:600;color:white;min-width:56px;}
.fnval{width:66px;font-size:12.5px;font-weight:600;text-align:right;flex-shrink:0;}
/* Branch header */
.bhd{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.bicon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0;}
.bname{font-size:22px;font-weight:700;}
.bpill{font-size:11px;color:var(--t2);background:var(--bg);border:1px solid var(--border);padding:3px 10px;border-radius:10px;}
.ndpill{font-size:11px;color:var(--t3);background:#f0f0ec;border:1px solid var(--border);padding:3px 10px;border-radius:10px;}
/* Monthly bars */
.mwrap{display:flex;align-items:flex-end;gap:14px;padding-top:4px;}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.mbar{width:100%;border-radius:4px 4px 0 0;}
.mval{font-size:12px;font-weight:600;white-space:nowrap;text-align:center;}
.mlbl{font-size:10.5px;color:var(--t3);white-space:nowrap;text-align:center;}
/* Misc */
.infobox{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:13px 17px;margin-bottom:14px;font-size:12.5px;color:var(--t2);line-height:1.7;}
.nodata{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:40px 24px;text-align:center;color:var(--t3);font-size:13.5px;}
.footer{font-size:10px;color:var(--t3);margin-top:24px;padding-top:14px;border-top:1px solid var(--borderl);display:flex;gap:20px;flex-wrap:wrap;}
.tabs{display:none !important;}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
  <div class="sb-logo"><div class="n">ADDMIND BEIRUT</div><div class="s">Ad Performance Report</div></div>
  <div class="sb-sec">Venue</div>
  <div class="sb-it on" onclick="nav('clap',this)"><span class="sb-dot" style="background:#2471a3;"></span>CLAP</div>
  <div class="sb-it" onclick="qnav('clap',this)"><span class="sb-dot" style="background:#999;"></span>Ads Quality</div>
  <div class="sb-it" onclick="dnav('clap',this)"><span class="sb-dot" style="background:#999;"></span>Demographics</div>
  <div class="sb-it" onclick="anav('clap',this)"><span class="sb-dot" style="background:#999;"></span>Account Insights</div>
  <div class="sb-foot">Addmind Beirut · Meta Ads<br/>Updated: 18 Oct 2026</div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="tb-ttl" id="tbt">CLAP — Performance</div>
    <div class="cal-wrap" id="cW">
      <div class="cal-btn" id="cB"><span class="ci">📅</span><span class="cl" id="cL">23 – 31 Mar 2026</span><span class="ca" id="cA">▼</span></div>
      <div class="cal-dd" id="cD">
        <div class="cal-scroll"><div class="cal-grid" id="cG"></div></div>
        <div class="cal-bar"><button class="cal-clr" onclick="calReset()">Reset</button><span class="cal-sum" id="cS">1 week selected</span></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on" onclick="setTab('perf',this)">Performance</div>
      <div class="tab" onclick="setTab('spend',this)">Monthly Spend</div>
      <div class="tab" onclick="setTab('mom',this)">MoM</div>
      <div class="tab" onclick="setTab('hist',this)">All Weeks</div>
    </div>
  </div>
  <div class="content" id="cnt"></div>
</div>
</div>

// helpers
const fN=n=>(!n)?'—':Number(n).toLocaleString('en-US');
const fK=n=>(!n)?'—':n>=1000?(n/1000).toFixed(1)+'K':String(n);
const f$=(n,d=0)=>(!n)?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const f2=n=>(!n)?'—':'$'+Number(n).toFixed(2);
const pct=(a,b)=>(!b||b===0)?null:((a-b)/b*100);
function chip(c,p,inv=false){const d=pct(c,p);if(d===null||(!c&&!p))return'<span class="chip neu">—</span>';const pos=inv?d<0:d>0;return`<span class="chip ${pos?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span>`;}
function tdD(d,inv=false){if(d===null)return'<td class="tna">—</td>';const pos=inv?d<0:d>0;return`<td class="${pos?'tup':'tdn'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</td>`;}
function mchip(d,inv=false){if(d===null)return'<span class="momchip neu">—</span>';const pos=inv?d<0:d>0;return`<span class="momchip ${pos?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span>`;}
function aggW(wids,vid,k){return wids.reduce((a,wid)=>{const w=WK.find(x=>x.id===wid);return a+(w?.v[vid]?.[k]||0);},0);}
function aggAll(wids,k){return V.reduce((a,v)=>a+aggW(wids,v.id,k),0);}
function getAds(wids,vid){
  const map={};
  wids.forEach(wid=>{const w=WK.find(x=>x.id===wid);(w?.v[vid]?.ads||[]).forEach(a=>{if(!map[a.n])map[a.n]={...a,sp:0,r:0,pv:0,re:0,im:0,cl:0};map[a.n].sp+=a.sp||0;map[a.n].r+=a.r||0;map[a.n].pv+=a.pv||0;map[a.n].re+=a.re||0;map[a.n].im+=a.im||0;map[a.n].cl+=a.cl||0;});});
  return Object.values(map);
}

function sLbl(){
  if(SEL_M){const mo=CAL.find(x=>x.mk===SEL_M);return mo?mo.m+' 2026':'Month';}
  if(!SEL.length)return 'No period selected';
  if(SEL.length===1){const w=WK.find(x=>x.id===SEL[0]);return w?w.label:'—';}
  return SEL.length+' weeks selected';
}

function buildCal(){
  document.getElementById('cG').innerHTML=CAL.map(mo=>{
    const wD=mo.wks.filter(w=>w.id&&WK.find(x=>x.id===w.id));
    const canM=mo.mk&&(wD.length>0||V.some(v=>MS[v.id]?.months?.[mo.mk]));
    const mSel=SEL_M===mo.mk;
    const mBtn=mo.mk?`<button class="cal-mbtn${mSel?' msel':''}" ${!canM?'disabled':''} onclick="pickM('${mo.mk}')">${mSel?'✓':''} Month</button>`:'';
    const wBtns=mo.wks.map(wk=>{
      const has=!!(wk.id&&WK.find(x=>x.id===wk.id));
      const sel=SEL.includes(wk.id);
      return`<button class="cal-wbtn${sel?' wsel':''}" ${!has?'disabled':''} ${has?`onclick="pickW('${wk.id}')"`:''}>${wk.l}</button>`;
    }).join('');
    return`<div class="cal-col"><div class="cal-mhd"><span class="cal-mname">${mo.m}</span>${mBtn}</div>${wBtns}</div>`;
  }).join('');
  const s=document.getElementById('cS');
  if(SEL_M){const mo=CAL.find(x=>x.mk===SEL_M);s.textContent=(mo?.m||'Month')+' 2026 selected';}
  else if(SEL.length){s.textContent=SEL.length+' week'+(SEL.length>1?'s':'')+' selected';}
  else s.textContent='Nothing selected';
  document.getElementById('cL').textContent=sLbl();
}
function pickW(wid){SEL_M=null;const i=SEL.indexOf(wid);if(i>=0)SEL.splice(i,1);else SEL.push(wid);if(!SEL.length)SEL=[DEF];EXP={};buildCal();render();}

// PERFORMANCE
function renderPerf(){
  if(!SEL.length)return'<div class="nodata">Select a period from the calendar above.</div>';
  const tS=sAll('sp'),tR=sAll('re'),tI=sAll('im'),tCl=sAll('cl'),tRs=sAll('r');
  // Split results: Conv. Started (messaging) vs Profile Visits (IG profile visits) — tracked independently per venue
  const sPV=(vid)=>WK.filter(w=>SEL.includes(w.id)).reduce((a,w)=>a+(w.v[vid]?.pv||0)+(vid==='gym'?(w.v[vid]?.r||0):0),0);
  // Calls (CLAP click-to-call weeks) are tracked separately from messaging conversations — never blended
  const sCalls=(vid)=>WK.filter(w=>SEL.includes(w.id)&&w.v[vid]?.rt==='Calls').reduce((a,w)=>a+(w.v[vid]?.r||0),0);
  const sConv=(vid)=>(['gym','hr'].includes(vid)?0:aggW(SEL,vid,'r')-sCalls(vid));
  const tConv=V.reduce((a,v)=>a+sConv(v.id),0);
  const tCalls=V.reduce((a,v)=>a+sCalls(v.id),0);
  const tProf=V.reduce((a,v)=>a+sPV(v.id),0);
  const tHR=aggW(SEL,'hr','cl');
  const mS=Math.max(...V.map(v=>sD(v.id,'sp')),1),mR=Math.max(...V.map(v=>sD(v.id,'re')),1);
  const sBars=V.map(v=>{const s=sD(v.id,'sp');return`<div class="brow"><div class="blbl">${v.name}</div><div class="btrack"><div class="bfill" style="width:${((s/mS)*100).toFixed(1)}%;background:${v.c}28;border-right:${s?3:1}px solid ${v.c}${s?'':'44'};"></div></div><div class="bnum" style="color:${s?v.c:'var(--t3)'};">${s?f$(s,0):'$0'}</div></div>`;}).join('');
  const rBars=V.map(v=>{const r=sD(v.id,'re');return`<div class="brow"><div class="blbl">${v.name}</div><div class="btrack"><div class="bfill" style="width:${((r/mR)*100).toFixed(1)}%;background:${v.c}28;border-right:${r?3:1}px solid ${v.c}${r?'':'44'};"></div></div><div class="bnum" style="color:${r?v.c:'var(--t3)'};">${r?fK(r):'0'}</div></div>`;}).join('');
  const trows=V.flatMap(v=>{
    const s=sD(v.id,'sp'),r=sD(v.id,'re'),i=sD(v.id,'im'),cl=sD(v.id,'cl'),rs=sD(v.id,'r');
    const pv=v.id==='gym'?rs:sPV(v.id);
    const ads=getAds(SEL,v.id),isO=!!EXP[v.id];
    const main=`<tr><td><span class="vc"><span class="vdot" style="background:${v.c};"></span>${v.name}</span></td><td>${s?f2(s):'$0'}</td><td>${r?fK(r):'0'}</td><td>${i?fN(i):'0'}</td><td>${cl?fN(cl):'0'}</td><td>${sConv(v.id)?fN(sConv(v.id)):'0'}</td><td>${sCalls(v.id)?fN(sCalls(v.id)):'0'}</td><td>${pv?fN(pv):'0'}</td>
      <td>${v.id==='hr'&&cl?fN(cl):'0'}</td>
      <td style="text-align:center;padding:6px;">${ads.length?`<span class="tog${isO?' open':''}" onclick="togE('${v.id}',event)">${isO?'▲':'▼'}</span>`:'<span class="tna">—</span>'}</td></tr>`;
    if(!isO||!ads.length)return[main];
    const aR=ads.map(a=>`<tr class="ads-row"><td>${a.n}</td><td>${a.sp?f2(a.sp):'—'}</td><td>${a.re?fK(a.re):'—'}</td><td>${a.im?fN(a.im):'—'}</td><td>${a.cl?fN(a.cl):'—'}</td><td>${a.r?fN(a.r)+(sCalls(v.id)?' <span style="color:var(--t3);font-size:10px;">(calls)</span>':''):(a.pv?fN(a.pv)+' <span style="color:var(--t3);font-size:10px;">(visits)</span>':'—')}</td><td style="text-align:left;white-space:normal;padding:7px 10px;">${a.note||''}</td></tr>`).join('');
    return[main,aR];
  }).join('');
  return`<div>
    <div class="kg" style="grid-template-columns:repeat(8,1fr);">
      <div class="kc"><div class="kl">Amount Spent</div><div class="kv">${tS?f$(tS,0):'—'}</div><div class="ks">${sLbl()}</div></div>
      <div class="kc"><div class="kl">Reach</div><div class="kv ${!tR?'na':''}">${tR?fK(tR):'—'}</div><div class="ks">Unique accounts</div></div>
      <div class="kc"><div class="kl">Impressions</div><div class="kv ${!tI?'na':''}">${tI?fK(tI):'—'}</div><div class="ks">Total ad views</div></div>
      <div class="kc"><div class="kl">Link Clicks</div><div class="kv ${!tCl?'na':''}">${tCl?fN(tCl):'—'}</div><div class="ks">All venues</div></div>
      <div class="kc"><div class="kl">Conv. Started</div><div class="kv ${!tConv?'na':''}">${tConv?fN(tConv):'—'}</div><div class="ks">Messaging conversations</div></div>
      <div class="kc"><div class="kl">Calls</div><div class="kv ${!tCalls?'na':''}">${tCalls?fN(tCalls):'—'}</div><div class="ks">Click-to-call</div></div>
      <div class="kc"><div class="kl">Profile Visits</div><div class="kv ${!tProf?'na':''}">${tProf?fN(tProf):'—'}</div><div class="ks">Instagram profile visits</div></div>
      <div class="kc"><div class="kl">HR Link Clicks</div><div class="kv ${!tHR?'na':''}">${tHR?fN(tHR):'—'}</div><div class="ks">Recruitment clicks</div></div>
    </div>
    <div class="g2">
      <div class="panel"><div class="pttl">Amount Spent — by Venue</div><div class="bars">${sBars}</div></div>
      <div class="panel"><div class="pttl">Reach — by Venue</div><div class="bars">${rBars}</div></div>
    </div>
    <div class="sec"><h2>All Venues — Performance Table</h2><span class="secn">▼ expand ad-set breakdown &amp; analysis</span></div>
    <div class="panel" style="padding:0;overflow:hidden;margin-bottom:18px;">
      <table class="dt">
        <thead><tr><th style="text-align:left;min-width:130px;">Venue</th><th>Spent</th><th>Reach</th><th>Impressions</th><th>Link Clicks</th><th>Conv. Started</th><th>Calls</th><th>Profile Visits</th><th>HR Clicks</th><th class="thc"></th></tr></thead>
        <tbody>${trows}</tbody>
        <tfoot><tr><td>TOTALS</td><td>${tS?f2(tS):'—'}</td><td>${tR?fK(tR):'—'}</td><td>${tI?fK(tI):'—'}</td><td>${tCl?fN(tCl):'—'}</td><td>${tConv?fN(tConv):'—'}</td><td>${tCalls?fN(tCalls):'—'}</td><td>${tProf?fN(tProf):'—'}</td><td>${tHR?fN(tHR):'—'}</td><td></td></tr></tfoot>
      </table>
    </div>
    <div class="footer"><span>Period: ${sLbl()}</span><span>⚡ Addmind Beirut — Meta Ads</span></div>
  </div>`;
}

// MONTHLY SPEND
function renderSpend(){
  const pt={};MS_VENUES.forEach(v=>{MNO.forEach(mk=>{if(!pt[mk])pt[mk]=0;pt[mk]+=(MS[v.id]?.months?.[mk]?.t||0);});});
  const kpi=MNO.filter(mk=>pt[mk]>0).map(mk=>`<div class="kc"><div class="kl">Total — ${MNL[mk]}</div><div class="kv">$${Math.round(pt[mk]).toLocaleString()}</div><div class="ks">All active venues</div></div>`).join('');
  const blocks=MNO.filter(mk=>pt[mk]>0).map(mk=>{
    const maxV=Math.max(...MS_VENUES.map(v=>MS[v.id]?.months?.[mk]?.t||0),1);
    const vrows=MS_VENUES.map(v=>{
      const md=MS[v.id]?.months?.[mk];if(!md||!md.t)return'';
      const key=`${v.id}_${mk}`,isO=!!SEX[key];
      const wrows=isO&&md.w?.length?`<div class="swr-wrap">${md.w.map(w=>`<div class="swr"><div class="swr-lbl">${w.l}</div><div class="swr-acts">${w.a}</div><div class="swr-amt">$${Number(w.s).toFixed(0)}</div></div>`).join('')}</div>`:'';
      return`<div><div class="svr"><span class="svr-dot" style="background:${v.c};"></span><span class="svr-name">${v.name}</span><div class="svr-bwrap"><div class="svr-bar" style="width:${((md.t/maxV)*100).toFixed(1)}%;background:${v.c}cc;"></div></div><span class="svr-amt">$${Math.round(md.t).toLocaleString()}</span><span class="svr-tog"><button class="${isO?'open':''}" onclick="togSX('${key}',event)">${isO?'▲':'▼'}</button></span></div>${wrows}</div>`;
    }).join('');
    return`<div class="spend-month-block"><div class="spend-month-hd"><span class="spend-month-name">${MNL[mk]}</span><span class="spend-month-total">$${Math.round(pt[mk]).toLocaleString()}</span></div>${vrows}</div>`;
  }).join('');

  // Weekly history: only show selected weeks

    <tfoot><tr><td>TOTAL</td><td>${f2(s)}</td><td>${fK(r)}</td><td>${fN(i)}</td><td>${fN(cl)}</td><td>${fN(rs)}</td><td></td></tr></tfoot></table></div>`:'';
  // AD QUALITY (Meta quality ranking per ad, with its ad set / activation)
  const qHas=WK.some(w=>(w.v[id]?.qa||[]).length||w.v[id]?.cr);

  const q3=qRows.some(x=>x.cl&&x.sp!=null&&x.sp/x.cl<0.1);
  const q$=n=>'$'+n.toFixed(q3?3:2);
  const qGroupRows=()=>{let o='',lastW=null,lastS=null;qRows.forEach(x=>{
    if(qMulti&&x.wl!==lastW){o+=`<tr class="qwk"><td colspan="${qCols}">${x.wl}</td></tr>`;lastW=x.wl;lastS=null;}
    if(x.s!==lastS){o+=`<tr class="qas"><td colspan="${qCols}">${x.s}</td></tr>`;lastS=x.s;}

  const qSec=qHas?`<div class="sec"><h2>Ad Quality</h2><span class="secn">${sLbl()}</span></div>
    <div class="panel" style="padding:0;overflow:hidden;margin-bottom:18px;">${qRows.length?`<table class="dt"><thead><tr><th style="text-align:left;">Ad</th><th style="text-align:left;">Quality Ranking</th>${qExt?`<th>Spent</th><th>Impressions</th><th>Link Clicks</th><th>CTR</th><th>CPC</th><th>CPM</th>`:'<th>Impressions</th>'}<th>${(['Calls','Profile Visits'].includes(rt)?rt:'Results')}</th></tr></thead>
    <tbody>${qGroupRows()}</tbody></table>
    <div class="qleg"><div class="qlh">How to read the ranking</div>

      <div class="qlr"><b>Below Average (Bottom 10% of ads)</b><span>Severe creative or post-click issues causing high user dissatisfaction.</span></div>
      <div class="qlh" style="margin-top:14px;">Why an ad can rank Below Average</div>
      <div class="qlr"><b>Negative feedback</b><span>People hide the ad, report it, or choose “I don’t want to see this”. This is what drives the Bottom 20% and Bottom 10% rankings.</span></div>
      <div class="qlr"><b>Strong competition</b><span>Other ads for the same audience are simply rated better, since the ranking is relative.</span></div>
      <div class="qlh" style="margin-top:14px;">Why some ads show “—”</div>
      <div class="qlp">Quality ranking compares each ad with other ads competing for the same audience, using Meta's own data. Meta only shows a ranking once an ad has gathered enough delivery in the selected period (a minimum of 500 impressions) and has enough comparable ads to be measured against. Ads with low delivery, or whose audience has too few comparable ads, are left unranked. Meta does not publish the exact reason for each ad, so “—” means no ranking was provided, not that the ad performed badly.</div>
    </div></div>`:'<div class="qnote" style="border-top:none;">No quality ranking data available for this period.</div>'}</div>${qCr?`<div class="sec"><h2>Creative Approach</h2><span class="secn">${sLbl()}</span></div><div class="panel" style="padding:16px 18px;margin-bottom:18px;"><div class="qlp">${qCr}</div></div>`:''}`:'';
  // DEMOGRAPHICS (age & gender, from Meta breakdowns)
  const dHas=WK.some(w=>w.v[id]?.dm);
  const dWks=selWKs.filter(w=>w.v[id]?.dm);
  const dK=n=>n>=1000?(n/1000).toPrecision(3)+'K':String(n);
  const dPanel=(title,rows,col)=>{const tI=rows.reduce((a,x)=>a+x.im,0),tR=rows.reduce((a,x)=>a+x.re,0),mx=Math.max(...rows.map(x=>x.im),1);
    return`<div class="panel" style="padding:16px 18px;"><div class="pttl">${title}</div>
    <div class="dmh"><span></span><span>Impressions</span><span>Share</span><span>Reach</span></div>
    ${rows.map(x=>`<div class="dmr"><div class="dml">${x.g}</div><div class="dmb"><i style="width:${Math.max(x.im/mx*100,1.5).toFixed(1)}%;background:${col};"></i><b>${dK(x.im)}</b></div><div class="dms">${(x.im/tI*100).toFixed(1)}%</div><div class="dmv">${dK(x.re)}</div></div>`).join('')}</div>`;};
  const dBlock=w=>{const d=w.v[id].dm;const top=(rows)=>rows.reduce((a,x)=>x.im>a.im?x:a,rows[0]);const tI=d.gen.reduce((a,x)=>a+x.im,0),g=top(d.gen),ag=top(d.age),aI=d.age.reduce((a,x)=>a+x.im,0);
    return`${dWks.length>1?`<div class="sec"><h2>${w.label}</h2></div>`:''}<div class="dmsum"><b>${g.g}</b> accounts for ${(g.im/tI*100).toFixed(0)}% of impressions · <b>${ag.g}</b> is the largest age group (${(ag.im/aI*100).toFixed(0)}% of impressions)</div>
    <div class="g2">${dPanel('Age',d.age,v.c+'cc')}${dPanel('Gender',d.gen,v.c+'99')}</div>`;};
  const dSec=dHas?`<div class="sec"><h2>Audience Demographics</h2><span class="secn">${sLbl()}</span></div>${dWks.length?dWks.map(dBlock).join(''):'<div class="panel"><div class="qnote" style="border-top:none;">No demographic data available for this period.</div></div>'}
    <div class="qnote" style="border:1px solid var(--border);border-radius:8px;margin-bottom:18px;">Source: Meta Ads Manager age and gender breakdowns, rounded as reported by Meta. Reach counts each person once across all ad sets, so it is lower than the sum of ad-set reach on the Performance page.</div>`:'';
  // ACCOUNT INSIGHTS (Meta Business Suite account-level numbers)
  const aHas=WK.some(w=>w.v[id]?.ai);
  const aWks=selWKs.filter(w=>w.v[id]?.ai);
  const aBlock=w=>{const x=w.v[id].ai;const c=(l,v,sub)=>`<div class="kc"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${sub}</div></div>`;
    return`${aWks.length>1?`<div class="sec"><h2>${w.label}</h2></div>`:''}<div class="kg" style="grid-template-columns:repeat(4,1fr);">${c('Views',x.views,`Instagram ${x.ig} · Facebook ${x.fb}`)}${c('Content Interactions',x.ci,'Total interactions')}${c('Instagram Profile Visits',x.pv,'Profile visits')}${c('Instagram Follows',x.fo,'New follows')}</div>`;};
  const aSec=aHas?`<div class="sec"><h2>Account Insights</h2><span class="secn">${sLbl()}</span></div>${aWks.length?aWks.map(aBlock).join(''):'<div class="panel"><div class="qnote" style="border-top:none;">No account insights available for this period.</div></div>'}`:'';
  if(QSIDE&&AV)return`<div>
    <div class="bhd"><div class="bicon" style="background:${v.c};">${init}</div><div class="bname">${v.name} — Account Insights</div><span class="bpill">📅 ${sLbl()}</span></div>
    ${aSec||'<div class="nodata">No account insights available.</div>'}
    <div class="footer"><span>Period: ${sLbl()}</span><span>⚡ Addmind Beirut · ${v.name}</span></div>
  </div>`;
  if(QSIDE&&DV)return`<div>
    <div class="bhd"><div class="bicon" style="background:${v.c};">${init}</div><div class="bname">${v.name} — Demographics</div><span class="bpill">📅 ${sLbl()}</span></div>
    ${dSec||'<div class="nodata">No demographic data available.</div>'}
    <div class="footer"><span>Period: ${sLbl()}</span><span>⚡ Addmind Beirut · ${v.name}</span></div>
  </div>`;
  if(QSIDE&&QV)return`<div>
    <div class="bhd"><div class="bicon" style="background:${v.c};">${init}</div><div class="bname">${v.name} — Ads Quality</div><span class="bpill">📅 ${sLbl()}</span></div>
    ${qSec||'<div class="nodata">No quality ranking data available.</div>'}
    <div class="footer"><span>Period: ${sLbl()}</span><span>⚡ Addmind Beirut · ${v.name}</span></div>
  </div>`;
  return`<div>
    <div class="bhd"><div class="bicon" style="background:${v.c};">${init}</div><div class="bname">${v.name}</div><span class="bpill">📅 ${sLbl()}</span>${!hasD?'<span class="ndpill">No active ads this period</span>':''}</div>
    <div class="kg" style="grid-template-columns:repeat(5,1fr);">
      <div class="kc"><div class="kl">Amount Spent</div><div class="kv ${!s?'na':''}">${s?f2(s):'$0'}</div><div class="ks">Period total</div></div>
      <div class="kc"><div class="kl">Reach</div><div class="kv ${!r?'na':''}">${r?fK(r):'0'}</div><div class="ks">Unique accounts</div></div>
      <div class="kc"><div class="kl">Impressions</div><div class="kv ${!i?'na':''}">${i?fN(i):'0'}</div><div class="ks">Total ad views</div></div>
      <div class="kc"><div class="kl">Link Clicks</div><div class="kv ${!cl?'na':''}">${cl?fN(cl):'0'}</div><div class="ks">All ad sets</div></div>
      <div class="kc"><div class="kl">Results</div><div class="kv ${!rs?'na':''}">${rs?fN(rs):'0'}</div><div class="ks">${rt}</div></div>
    </div>
    <div class="g2"><div class="panel"><div class="pttl">Audience Funnel</div><div class="funnel">${funnel}</div></div><div class="panel"><div class="pttl">${pttlSpend}</div><div class="mwrap" style="height:${mV.length===1?'80px':'100px'}">${mBars}</div></div></div>
    ${adSec}
    ${QSIDE?'':qSec}
    ${QSIDE?'':dSec}
    ${QSIDE?'':aSec}
    ${selWKs.length>1?`<div class="sec"><h2>Weekly Breakdown</h2></div><div class="panel" style="padding:0;overflow:hidden;margin-bottom:18px;"><table class="dt" style="font-size:12.5px;"><thead><tr><th style="text-align:left;width:115px;">Metric</th>${selWKs.map(w=>`<th>${w.label}</th>`).join('')}</tr></thead><tbody>${hR}</tbody></table></div>`:''}
    <div class="footer"><span>Period: ${sLbl()}</span><span>⚡ Addmind Beirut · ${v.name}</span></div>
  </div>`;
}

function render(){
  let h='';
  if(VIEW==='all'){if(TAB==='perf')h=renderPerf();else if(TAB==='spend')h=renderSpend();else if(TAB==='mom')h=renderMoM();else h=renderHist();}
  else h=renderVenue(VIEW);
  document.getElementById('cnt').innerHTML=h;
}
buildCal();render();
</script>
</body>
</html>
